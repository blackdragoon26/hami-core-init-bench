<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HAMi-core initialization path at commit 5496322, showing cuInit branching into preInit and postInit, the three serialisation points, and which of them the dead unified lock is not on.">
  <rect width="900" height="560" fill="#f4f6f1"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#12201a"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#12201a" font-weight="700">HAMi-core initialization at commit 5496322 — where concurrent starts actually queue</text>

  <!-- cuInit -->
  <rect x="360" y="48" width="180" height="40" rx="9" fill="#ffffff" stroke="#12201a" stroke-width="1.6"/>
  <text x="450" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#12201a" font-weight="600">cuInit()  libvgpu.c:932</text>

  <line x1="450" y1="88" x2="450" y2="112" stroke="#12201a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- preInit -->
  <rect x="330" y="114" width="240" height="38" rx="9" fill="#ffffff" stroke="#12201a" stroke-width="1.4"/>
  <text x="450" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#12201a">preInit() → ensure_initialized()</text>

  <line x1="450" y1="152" x2="450" y2="176" stroke="#12201a" stroke-width="1.4"/>
  <line x1="220" y1="176" x2="680" y2="176" stroke="#12201a" stroke-width="1.4"/>
  <line x1="220" y1="176" x2="220" y2="200" stroke="#12201a" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="680" y1="176" x2="680" y2="200" stroke="#12201a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- S1 -->
  <rect x="70" y="202" width="300" height="86" rx="10" fill="#fdf1e3" stroke="#b5772f" stroke-width="2"/>
  <text x="220" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#b5772f" font-weight="700">① try_create_shrreg()  :1155</text>
  <text x="220" y="243" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#12201a">lockf(F_LOCK) :1266 → F_ULOCK :1327</text>
  <text x="220" y="259" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#12201a">whole-file lock across region setup</text>
  <text x="220" y="277" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#b5772f" font-weight="600">measured: exactly 2N fcntl calls</text>

  <!-- S2 -->
  <rect x="530" y="202" width="300" height="86" rx="10" fill="#fdf1e3" stroke="#b5772f" stroke-width="2"/>
  <text x="680" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#b5772f" font-weight="700">② init_proc_slot_withlock()  :1044</text>
  <text x="680" y="243" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#12201a">lock_shrreg() → clear_proc_slot_nolock(1)</text>
  <text x="680" y="259" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#12201a">proc_alive() reads /proc/&lt;pid&gt;/stat per slot</text>
  <text x="680" y="277" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#b5772f" font-weight="600">measured: exactly N(N+1)/2 procfs opens</text>

  <line x1="220" y1="288" x2="220" y2="312" stroke="#12201a" stroke-width="1.4"/>
  <line x1="680" y1="288" x2="680" y2="312" stroke="#12201a" stroke-width="1.4"/>
  <line x1="220" y1="312" x2="680" y2="312" stroke="#12201a" stroke-width="1.4"/>
  <line x1="450" y1="312" x2="450" y2="336" stroke="#12201a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- real cuInit -->
  <rect x="345" y="338" width="210" height="34" rx="9" fill="#ffffff" stroke="#12201a" stroke-width="1.4"/>
  <text x="450" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#12201a">real driver cuInit</text>

  <line x1="450" y1="372" x2="450" y2="396" stroke="#12201a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- S3 -->
  <rect x="270" y="398" width="360" height="96" rx="10" fill="#fdf1e3" stroke="#b5772f" stroke-width="2"/>
  <text x="450" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#b5772f" font-weight="700">③ postInit() → set_task_pid()  utils.c:98</text>
  <text x="450" y="439" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#12201a">lock_postinit() → NVML snapshot →</text>
  <text x="450" y="455" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#12201a">cuDevicePrimaryCtxRetain :133 → snapshot → diff →</text>
  <text x="450" y="471" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#12201a">cuDevicePrimaryCtxRelease :171</text>
  <text x="450" y="488" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4b5a4f" font-style="italic">needs a GPU — not measured here</text>

  <!-- dead code note -->
  <rect x="70" y="512" width="760" height="34" rx="9" fill="none" stroke="#4b5a4f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="450" y="534" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#4b5a4f">try_lock_unified_lock() — defined in utils.c:22, declared in utils.h:8, <tspan font-weight="700">zero call sites</tspan>. Not on this path at all.</text>
</svg>
